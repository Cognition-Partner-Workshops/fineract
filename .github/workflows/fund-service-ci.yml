# Minimal, PATH-SCOPED CI for the Fund carve-out ONLY.
#
# Triggers only on changes under the two carve-out modules (or this workflow itself),
# builds ONLY those two modules, and runs the compose-based E2E smoke test. It deliberately
# does NOT re-enable the heavy upstream Apache Fineract CI (no other workflows are added).
name: Fund Service CI

on:
  push:
    paths:
      - 'fineract-fund-service/**'
      - 'fineract-gateway/**'
      - '.github/workflows/fund-service-ci.yml'
  pull_request:
    paths:
      - 'fineract-fund-service/**'
      - 'fineract-gateway/**'
      - '.github/workflows/fund-service-ci.yml'

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the two carve-out modules (spotless + license + tests)
        run: ./gradlew :fineract-fund-service:build :fineract-gateway:build

      - name: Run the E2E parity / smoke test against the compose stack
        run: ./fineract-fund-service/e2e/smoke-test.sh
