plugins {
    id 'io.qameta.allure' version '4.3.0'
}

apply plugin: 'java'
apply plugin: 'eclipse'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(project(':fineract-avro-schemas'))
    testImplementation(project(':fineract-client'))
    testImplementation(project(':fineract-client-feign'))
    testImplementation(rootProject.project(':fineract-e2e-tests-core').sourceSets.test.output)

    testImplementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-test'
    testImplementation 'org.springframework:spring-jms'

    testImplementation 'com.squareup.retrofit2:retrofit:2.11.0'
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
    testImplementation 'org.apache.commons:commons-lang3:3.18.0'
    testImplementation ('com.googlecode.json-simple:json-simple:1.1.1') {
        exclude group: 'junit', module: 'junit'
    }
    testImplementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.junit.platform:junit-platform-console'
    testImplementation 'io.cucumber:cucumber-java:7.20.1'
    testImplementation 'io.cucumber:cucumber-junit:7.20.1'
    testImplementation 'io.cucumber:cucumber-spring:7.20.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.20.1'

    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.29.1'

    testImplementation 'org.assertj:assertj-core'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation "ch.qos.logback:logback-core"
    testImplementation "ch.qos.logback:logback-classic"

    testImplementation 'org.apache.activemq:activemq-client:6.1.6'
    testImplementation "org.apache.avro:avro:1.12.0"
    testImplementation "org.awaitility:awaitility:4.2.2"
    testImplementation 'io.github.classgraph:classgraph:4.8.179'

    testImplementation 'org.apache.commons:commons-collections4:4.4'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty("cucumber.junit-platform.naming-strategy", "long")
}

tasks.register('cucumber', JavaExec) {
    group = 'verification'
    description = 'Runs Cucumber scenarios against a running Fineract server'
    dependsOn tasks.named('testClasses'), tasks.named('spotlessCheck')
    finalizedBy 'allureReport'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.cucumber.core.cli.Main'
    systemProperties gradle.startParameter.systemPropertiesArgs.findAll { key, value ->
        !key.startsWith('java.') && !key.startsWith('org.gradle.')
    }
    args '--tags', providers.gradleProperty('cucumber.tags').getOrElse('not @Skip'),
        '--plugin', 'pretty',
        '--plugin', 'io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm'
    if (providers.gradleProperty('cucumber.name').isPresent()) {
        args '--name', providers.gradleProperty('cucumber.name').get()
    }
    args providers.gradleProperty('cucumber.features').getOrElse('src/test/resources/features')
}

allure {
    version = '2.17.3'
}

test {
    useJUnitPlatform()
}
